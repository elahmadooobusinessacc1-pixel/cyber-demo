<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER DEMO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020805;color:#00ff66;
 font-family:monospace;overflow:hidden;
}
canvas{
 position:fixed;inset:0;width:100%;height:100%;
 opacity:.35;z-index:-1;
}
.box{
 width:90%;max-width:650px;
 margin:65px auto;padding:25px;
 border:1px solid #00ff66;
 background:#001008e8;
 box-shadow:0 0 25px #00ff6655;
}
h1{text-align:center;letter-spacing:5px}
.subtitle{text-align:center;color:#8affaa}
.progress{
 height:15px;border:1px solid #00ff66;
 margin-top:15px;
}
#bar{height:100%;width:0;background:#00ff66}
#percent{text-align:center;font-size:25px;margin:15px}
#logs{line-height:2;min-height:150px}
#done{display:none;text-align:center;font-size:22px;color:#00ff66}
.notice{text-align:center;font-size:11px;color:#aaffbb}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="box">
<h1>CYBER DEMO</h1>
<div class="subtitle">SIMULATED SYSTEM SCAN</div>
<hr>
<p>PROCESSING...</p>
<div class="progress"><div id="bar"></div></div>
<div id="percent">0%</div>
<div id="logs"></div>
<div id="done">✓ PROCESS COMPLETED</div>
<hr>
<div class="notice">SIMULATION ONLY — NO REAL ACCESS</div>
</div>

<script>
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
let columns,drops;

function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
 columns=Math.floor(canvas.width/15);
 drops=Array(columns).fill(1);
}
resize();
window.addEventListener("resize",resize);

function matrix(){
 ctx.fillStyle="rgba(0,8,3,0.12)";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#00ff66";
 ctx.font="15px monospace";
 drops.forEach((y,i)=>{
 ctx.fillText(Math.random()<.5?"0":"1",i*15,y*15);
 if(y*15>canvas.height&&Math.random()>.975)drops[i]=0;
 drops[i]++;
 });
}
setInterval(matrix,45);

let progress=0;
const bar=document.getElementById("bar");
const percent=document.getElementById("percent");

const timer=setInterval(()=>{
 if(progress<100){
 progress++;
 bar.style.width=progress+"%";
 percent.textContent=progress+"%";
 }else{
 clearInterval(timer);
 document.getElementById("done").style.display="block";
 }
},500);
</script>
</body>
</html>
